# Local development / demo stack: PostgreSQL, migrations, API, email worker, web, Mailpit.
# Usage: docker compose up --build   →   http://localhost:8080  (emails: http://localhost:8025)
# Every value has a working default; override them in a root .env (see .env.example).

# Keep container logs small (SEC-06): at most 3 files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aporia}:${POSTGRES_PASSWORD:-aporia}@db:5432/${POSTGRES_DB:-aporia}
  # Browser origins allowed to send POST/PATCH/PUT/DELETE (CSRF check): the web app and Swagger UI.
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080},http://localhost:${API_PORT:-8000},http://127.0.0.1:${API_PORT:-8000}}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
  # Signs unsubscribe links. The API refuses to start in production with this placeholder.
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-8080}}
  # Mailpit catches every email locally; set real SMTP values for production.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  MAIL_FROM: ${MAIL_FROM:-Aporia <no-reply@aporia.localhost>}

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aporia}
      POSTGRES_USER: ${POSTGRES_USER:-aporia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aporia}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: applies Alembic migrations, then exits. The API starts only after it succeeds.
  migrate:
    logging: *logging
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    logging: *logging
    build: ./backend
    environment:
      <<: *backend-env
      # Only nginx (web) and local tools reach the API, so the X-Forwarded-For
      # header that nginx sets can be trusted. Never publish port 8000 publicly.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Sends queued "new essay" emails (one process, polls the email_jobs table).
  worker:
    logging: *logging
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    healthcheck:
      # Healthy while the worker loop keeps touching its heartbeat file.
      test: ["CMD", "python", "-m", "app.worker.healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    logging: *logging
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Development only: an SMTP server that keeps every email in a web inbox.
  mailpit:
    logging: *logging
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025" # web inbox
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP, for a backend running outside Docker
    restart: unless-stopped

volumes:
  db-data:
