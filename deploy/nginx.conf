# nginx for the single-container image (deploy/Dockerfile). deploy/start.sh fills in
# @REAL_IP_HEADER@ and writes the site (frontend/nginx.conf) to /tmp/nginx/site.conf.
worker_processes 1;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;

    # nginx runs as the unprivileged "aporia" user, so its scratch files live in /tmp.
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Only the host's load balancer reaches this container, so the visitor's address
    # comes from the header it sets (rate limits use it). For X-Forwarded-For nginx
    # takes the last entry, the one the load balancer added, never one a visitor sent.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header @REAL_IP_HEADER@;

    include /tmp/nginx/site.conf;
}
